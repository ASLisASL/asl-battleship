<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASL Battleship</title>

<style>

body {
  font-family: Arial, sans-serif;
  text-align:center;
}

button {
  padding:8px 12px;
  margin:5px;
  cursor:pointer;
}

#message {
  font-size:20px;
  font-weight:bold;
  margin:15px;
}

#status {
  font-size:18px;
  margin:10px;
}

.game-grid {
  display:grid;
  grid-template-columns:35px repeat(10,40px);
  grid-template-rows:35px repeat(10,40px);
  gap:4px;
  justify-content:center;
}

.label {
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.square {
  width:40px;
  height:40px;
  background:lightblue;
  border:1px solid black;
  cursor:pointer;
}

.preview {
  background:#999;
}

.ship {
  background:gray;
}

.locked {
  pointer-events:none;
}

</style>

</head>


<body>

<h1>🤟 ASL Battleship</h1>


<div id="message">
Choose a ship
</div>


<div id="status">
</div>


<div id="ships">

<button onclick="selectShip('Carrier',5)">
Carrier 🚢 5
</button>

<button onclick="selectShip('Battleship',4)">
Battleship 🚢 4
</button>

<button onclick="selectShip('Cruiser',3)">
Cruiser 🚢 3
</button>

<button onclick="selectShip('Submarine',3)">
Submarine 🚢 3
</button>

<button onclick="selectShip('Destroyer',2)">
Destroyer 🚢 2
</button>

</div>


<button id="readyButton" onclick="readyUp()" style="display:none;">
✅ Ready
</button>


<div id="gameGrid" class="game-grid"></div>



<script>

const gameGrid=document.getElementById("gameGrid");
const message=document.getElementById("message");
const status=document.getElementById("status");
const readyButton=document.getElementById("readyButton");


const letters=[
"A","B","C","D","E",
"F","G","H","I","J"
];


let selectedShip=null;

let currentSquares=[];

let shipsPlaced=[];

let ready=false;



function selectShip(name,size){

if(ready){
return;
}


selectedShip={
name:name,
size:size
};


currentSquares=[];


message.textContent=
"Place "+name+" - choose "+size+" connected squares";


}




function drawBoard(){

gameGrid.innerHTML="";


gameGrid.appendChild(document.createElement("div"));



letters.forEach(letter=>{

let label=document.createElement("div");

label.className="label";
label.textContent=letter;

gameGrid.appendChild(label);

});



for(let row=0;row<10;row++){


let number=document.createElement("div");

number.className="label";
number.textContent=row+1;

gameGrid.appendChild(number);



for(let col=0;col<10;col++){


let square=document.createElement("div");

square.className="square";


let location=row*10+col;



square.onclick=function(){


if(!selectedShip || ready){
return;
}



if(currentSquares.includes(location)){
return;
}



if(currentSquares.length>0){


let connected=currentSquares.some(old=>{


let oldRow=Math.floor(old/10);
let oldCol=old%10;


let newRow=Math.floor(location/10);
let newCol=location%10;


return Math.abs(oldRow-newRow)+
Math.abs(oldCol-newCol)===1;


});



if(!connected){

message.textContent=
"❌ Must connect to your ship";

return;

}


}



currentSquares.push(location);


drawBoard();



if(currentSquares.length===selectedShip.size){


shipsPlaced.push({

name:selectedShip.name,

positions:[...currentSquares]

});


removeShipButton(selectedShip.name);


message.textContent=
selectedShip.name+" complete!";


selectedShip=null;

currentSquares=[];


checkReady();


drawBoard();

}



};



gameGrid.appendChild(square);


}

}

showShips();


showPreview();


}



function showShips(){

let squares=document.querySelectorAll(".square");


shipsPlaced.forEach(ship=>{


ship.positions.forEach(pos=>{


if(squares[pos]){

squares[pos].classList.add("ship");

}


});


});


}




function showPreview(){

let squares=document.querySelectorAll(".square");


currentSquares.forEach(pos=>{


if(squares[pos]){

squares[pos].classList.add("preview");

}


});


}




function removeShipButton(name){

document.querySelectorAll("#ships button")
.forEach(button=>{


if(button.textContent.includes(name)){

button.remove();

}


});


}




function checkReady(){

if(shipsPlaced.length===5){

readyButton.style.display="inline-block";


message.textContent=
"All ships placed! Ready?";

}

}




function readyUp(){

ready=true;


document.querySelectorAll("button")
.forEach(button=>{

if(button!==readyButton){

button.style.display="none";

}

});



readyButton.style.display="none";


message.textContent=
"✅ Player Ready!";


status.textContent=
"⏳ Waiting for opponent...";


drawBoard();


}



drawBoard();


</script>

</body>
</html>
