<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>ASL Battleship</title>

<style>

body{
font-family:Arial,sans-serif;
text-align:center;
background:#e8f6ff;
}

.screen{
display:none;
}

.active{
display:block;
}

button{
padding:12px 20px;
margin:10px;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

input{
padding:12px;
font-size:18px;
text-align:center;
text-transform:uppercase;
}

.roomCode{

font-size:40px;
font-weight:bold;
letter-spacing:8px;
margin:20px;

}

.card{

background:white;
border:2px solid #333;
border-radius:12px;
padding:20px;
margin:20px auto;
max-width:500px;

}

</style>

</head>


<body>


<h1>🤟 ASL Battleship 🚢</h1>



<!-- HOME -->

<div id="home" class="screen active card">

<h2>Welcome!</h2>

<p>
Create a game or join a friend's game.
</p>


<button onclick="createGame()">
🚢 Create New Game
</button>


<br>


<button onclick="showJoin()">
🎯 Join Game
</button>


</div>



<!-- JOIN -->

<div id="join" class="screen card">

<h2>Join Game</h2>


<input id="joinCode" placeholder="ROOM CODE">


<br>


<button onclick="joinGame()">
JOIN
</button>


<button onclick="goHome()">
Back
</button>


</div>




<!-- WAITING -->

<div id="waiting" class="screen card">


<h2>Waiting Room</h2>


<p>
Share this code with your opponent:
</p>


<div class="roomCode" id="roomDisplay">

</div>


<p id="waitingText">
Waiting for player...
</p>


<button onclick="simulateJoin()">
(Test: Join Player)
</button>


</div>





<!-- RULES -->

<div id="rules" class="screen card">


<h2>🚢 How To Play</h2>


<p>
1. Place your ships
</p>

<p>
2. Take turns attacking
</p>

<p>
3. Sink all enemy ships to win!
</p>


<button onclick="startSetup()">
START
</button>


</div>




<script>


let roomCode="";



function showScreen(id){

document.querySelectorAll(".screen")
.forEach(screen=>{

screen.classList.remove("active");

});


document.getElementById(id)
.classList.add("active");

}



function createGame(){


roomCode=
Math.random()
.toString(36)
.substring(2,7)
.toUpperCase();



document.getElementById("roomDisplay")
.textContent=roomCode;


showScreen("waiting");


}




function showJoin(){

showScreen("join");

}




function joinGame(){


let code=
document.getElementById("joinCode")
.value
.toUpperCase();



if(code.length===5){


roomCode=code;


showScreen("rules");


}

else{


alert("Please enter a 5 character room code");

}


}




function simulateJoin(){


document.getElementById("waitingText")
.textContent=
"🎉 Player joined!";


setTimeout(()=>{

showScreen("rules");

},1000);


}




function startSetup(){


alert(
"Next step: Ship setup screen 🚢"
);


}




function goHome(){

showScreen("home");

}



</script>


</body>

</html>
