<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>ASL Battleship</title>

<style>

body{
font-family:Arial,sans-serif;
text-align:center;
}

.boards{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
}

.panel{
border:2px solid black;
padding:15px;
}

.shipStatus{
margin:10px;
font-size:18px;
}

.dot{
display:inline-block;
width:18px;
height:18px;
border-radius:50%;
background:gray;
margin:2px;
}

.dot.hit{
background:red;
}

.game-grid{
display:grid;
grid-template-columns:35px repeat(10,35px);
grid-template-rows:35px repeat(10,35px);
gap:3px;
justify-content:center;
}

.label{
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.square{
width:35px;
height:35px;
background:lightblue;
border:1px solid black;
cursor:pointer;
}

.ship{
background:gray;
}

.hit{
background:red;
}

.miss{
background:white;
}

</style>

</head>


<body>

<h1>🤟 ASL Battleship</h1>

<h2 id="message">
Battle Start!
</h2>


<div class="boards">


<div class="panel">

<h2>🚢 My Fleet</h2>

<div id="myFleet"></div>

<div id="myBoard" class="game-grid"></div>

</div>



<div class="panel">

<h2>🎯 Enemy Waters</h2>

<div id="enemyFleet"></div>

<div id="attackBoard" class="game-grid"></div>

</div>


</div>



<script>


const letters=[
"A","B","C","D","E",
"F","G","H","I","J"
];



let myShips=[

{
name:"Carrier",
size:5,
positions:[22,23,24,25,26],
hits:[]
},

{
name:"Battleship",
size:4,
positions:[51,52,53,54],
hits:[]
},

{
name:"Cruiser",
size:3,
positions:[70,71,72],
hits:[]
},

{
name:"Submarine",
size:3,
positions:[10,20,30],
hits:[]
},

{
name:"Destroyer",
size:2,
positions:[80,81],
hits:[]
}

];



let enemyShips=[

{
name:"Carrier",
size:5,
positions:[15,16,17,18,19],
hits:[]
},

{
name:"Battleship",
size:4,
positions:[40,41,42,43],
hits:[]
},

{
name:"Cruiser",
size:3,
positions:[60,61,62],
hits:[]
},

{
name:"Submarine",
size:3,
positions:[5,15,25],
hits:[]
},

{
name:"Destroyer",
size:2,
positions:[90,91],
hits:[]
}

];


let attacked=[];

let sunkEnemyShips=[];



function createBoard(id,clickFunction){

let board=document.getElementById(id);

board.innerHTML="";


board.appendChild(document.createElement("div"));



letters.forEach(letter=>{

let label=document.createElement("div");

label.className="label";
label.textContent=letter;

board.appendChild(label);

});



for(let row=0;row<10;row++){


let number=document.createElement("div");

number.className="label";
number.textContent=row+1;

board.appendChild(number);



for(let col=0;col<10;col++){


let square=document.createElement("div");

square.className="square";


let location=row*10+col;


square.onclick=function(){

clickFunction(location,square);

};


board.appendChild(square);

}

}

}




function coordinate(location){

let row=Math.floor(location/10);

let col=location%10;


return letters[col]+(row+1);

}




function dots(amount){

let result="";


for(let i=0;i<amount;i++){

result+="<span class='dot hit'></span>";

}


return result;

}




function updatePanels(){


let my=document.getElementById("myFleet");

let enemy=document.getElementById("enemyFleet");


my.innerHTML="";
enemy.innerHTML="";



myShips.forEach(ship=>{


my.innerHTML+=

"<div class='shipStatus'>"+
ship.name+"<br>"+
dots(ship.hits.length)+
" "+
(ship.size-ship.hits.length)+
" left"+
(ship.hits.length===ship.size?
" 💥 SUNK":"")+
"</div>";

});





sunkEnemyShips.forEach(ship=>{


enemy.innerHTML+=

"<div class='shipStatus'>"+
"💥 "+ship.name+" SUNK"+
"</div>";


});



let damage=0;


enemyShips.forEach(ship=>{

if(ship.hits.length>0 &&
ship.hits.length<ship.size){

damage+=ship.hits.length;

}

});



if(damage>0){


enemy.innerHTML+=

"<div class='shipStatus'>"+
"Detected Damage<br>"+
dots(damage)+
"</div>";


}



if(
sunkEnemyShips.length===0 &&
damage===0
){

enemy.innerHTML=
"No information yet";

}



}





function attack(location,square){


if(attacked.includes(location)){
return;
}


attacked.push(location);



let ship=
enemyShips.find(s=>
s.positions.includes(location)
);



let spot=coordinate(location);



if(ship){


ship.hits.push(location);


square.classList.add("hit");


document.getElementById("message").textContent=
"🎯 Attack "+spot+" — HIT!";



if(ship.hits.length===ship.size){


sunkEnemyShips.push(ship);


document.getElementById("message").textContent=
"💥 "+ship.name+" SUNK!";


}


}

else{


square.classList.add("miss");


document.getElementById("message").textContent=
"🎯 Attack "+spot+" — MISS!";


}


updatePanels();


}




function enemyAttack(location){


let square=
document.querySelectorAll("#myBoard .square")[location];


let ship=
myShips.find(s=>
s.positions.includes(location)
);



if(ship){

ship.hits.push(location);

square.classList.add("hit");

}

else{

square.classList.add("miss");

}


updatePanels();


}



createBoard(
"myBoard",
enemyAttack
);


createBoard(
"attackBoard",
attack
);


updatePanels();


</script>


</body>
</html>
