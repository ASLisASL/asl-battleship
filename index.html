<button onclick="selectShip('Carrier',5)">

<script>


const letters=[
"A","B","C","D","E",
"F","G","H","I","J"
];


let selectedShip=null;

let currentSquares=[];

let shipsPlaced=[];

let direction=null;

function undoSquare(){

if(currentSquares.length>0){


currentSquares.pop();



if(currentSquares.length<2){

direction=null;

}


drawBoard();

updateProgress();


}

}




function resetShip(){

currentSquares=[];

direction=null;


drawBoard();

updateProgress();


document.getElementById("message").textContent =
"Reset ship placement";


}




function showCurrent(){


let squares=document.querySelectorAll(".square");



currentSquares.forEach(position=>{


if(squares[position]){


squares[position].classList.add("preview");


}


});


}




function showShips(){


let squares=document.querySelectorAll(".square");



shipsPlaced.forEach(ship=>{


ship.positions.forEach(position=>{


if(squares[position]){


squares[position].classList.add("ship");


}


});


});


}




function removeButton(name){


document.querySelectorAll("#buttons button")
.forEach(button=>{


if(button.textContent.includes(name)){


button.remove();


}


});


}




function checkReady(){


if(shipsPlaced.length===5){


document.getElementById("readyButton")
.style.display="inline-block";


document.getElementById("message").textContent =
"🚢 All ships ready!";


}


}




// Start board

drawBoard();
