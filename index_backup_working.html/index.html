<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>ASL Battleship</title>


<style>

body{

font-family:Arial,sans-serif;
text-align:center;
background:#e8f6ff;

}


.panel{

background:white;
border:2px solid #333;
border-radius:12px;
padding:20px;
margin:20px auto;
max-width:850px;

}


button{

padding:10px 15px;
margin:5px;
font-size:16px;
cursor:pointer;
border-radius:8px;

}


input{

padding:10px;
font-size:18px;
text-align:center;

}


.hidden{

display:none;

}


.board{

display:grid;
grid-template-columns:40px repeat(10,60px);
grid-template-rows:40px repeat(10,45px);
gap:3px;
justify-content:center;

}


.square{

width:60px;
height:45px;
background:#9edcff;
border:1px solid black;

}



.container{

display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;

}


</style>

</head>


<body>


<h1>🤟 ASL Battleship 🚢</h1>



<!-- HOME -->

<div id="homeScreen" class="panel">


<h2>Welcome!</h2>


<p>
Practice ASL vocabulary while playing Battleship.
</p>


<button onclick="createGame()">

Create Game

</button>


<button onclick="showJoin()">

Join Game

</button>


</div>





<!-- JOIN -->

<div id="joinScreen" class="panel hidden">


<h2>Join Game</h2>


<input id="joinCode" placeholder="Enter Room Code">


<br>


<button onclick="joinGame()">

JOIN

</button>


</div>





<!-- WAITING -->

<div id="waitingScreen" class="panel hidden">


<h2>Waiting Room</h2>


<h3 id="roomDisplay"></h3>


<p id="playerStatus">

Waiting...

</p>


<button id="startButton" style="display:none">

START GAME

</button>


</div>





<!-- GAME -->

<div id="gameScreen" class="hidden">


<div class="panel">


<h2>🚢 Fleet Setup</h2>


<h3 id="message">

Choose a ship

</h3>


<div id="ships"></div>


</div>



<div id="board" class="board"></div>


</div>





<!-- BATTLE -->

<div id="battleScreen" class="hidden">


<div class="panel">


<h2>⚔️ ASL Battleship Battle</h2>


<h3 id="turnMessage">

Your Turn

</h3>


</div>


</div>






<!-- IMPORTANT -->
<!-- ALL JAVASCRIPT GOES INSIDE THIS ONE SCRIPT -->


<script type="module">


// ==========================
// FIREBASE CONNECTION
// ==========================


// Firebase imports

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import { getDatabase, ref, set, get, child, update } 
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";




// YOUR FIREBASE CONFIG

const firebaseConfig = {
  apiKey: "AIzaSyD-96f3sXz9pT6AdR6R4yDkMIdXxtGw0l4",
  authDomain: "asl-battleship.firebaseapp.com",
  projectId: "asl-battleship",
  storageBucket: "asl-battleship.firebasestorage.app",
  messagingSenderId: "885145188874",
  appId: "1:885145188874:web:1d64fe001a4b9822bc7df3"
};




// START FIREBASE

const app = initializeApp(firebaseConfig);


const database = getDatabase(app);



console.log("Firebase connected!");

// ==========================
// PART 3 - CREATE GAME ROOM
// ==========================


let roomCode = "";



// Generate random room code

function generateCode(){


    let characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let result = "";


    for(let i = 0; i < 5; i++){

        result += characters[
            Math.floor(Math.random() * characters.length)
        ];

    }


    return result;

}




// Create Game Button

window.createGame = async function(){

  console.log("CREATE BUTTON WORKS");

    roomCode = generateCode();



    await set(

        ref(database, "rooms/" + roomCode),

        {

            player1: true,

            player2: false,

            status: "waiting"

        }

    );
    
   




    document.getElementById("homeScreen")
    .classList.add("hidden");



    document.getElementById("waitingScreen")
    .classList.remove("hidden");



    document.getElementById("roomDisplay")
    .textContent =

    "Room Code: " + roomCode;



    document.getElementById("playerStatus")
    .innerHTML =

    `
    Player 1 ✅
    <br>
    Waiting for Player 2...
    `;



};


// ==========================
// SHOW JOIN SCREEN
// ==========================

window.showJoin = function(){

    document.getElementById("homeScreen")
    .classList.add("hidden");


    document.getElementById("joinScreen")
    .classList.remove("hidden");

};

// ==========================
// PART 4 - JOIN GAME
// ==========================


window.joinGame = async function(){


    let enteredCode = document.getElementById("joinCode")
    .value
    .toUpperCase();



    if(enteredCode === ""){

        alert("Enter a room code!");

        return;

    }



    const roomRef = ref(database, "rooms/" + enteredCode);



    const snapshot = await get(roomRef);



    if(snapshot.exists()){


await update(roomRef, {

    player2: true,

    status: "ready"

}).then(()=>{

    console.log("DATABASE UPDATED SUCCESSFULLY");

}).catch((error)=>{

    console.log("ERROR:", error);

});


console.log("UPDATED ROOM:", enteredCode);




        document.getElementById("homeScreen")
        .classList.add("hidden");



        document.getElementById("joinScreen")
        .classList.add("hidden");



        document.getElementById("waitingScreen")
        .classList.remove("hidden");



        document.getElementById("roomDisplay")
        .textContent =

        "Room Code: " + enteredCode;



        document.getElementById("playerStatus")
        .innerHTML =

        `
        Player 1 ✅
        <br>
        Player 2 ✅
        `;



    }

    else{


        alert("Room not found!");

    }


};





</script>


</body>

</html>
